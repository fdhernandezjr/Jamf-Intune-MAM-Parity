name: Terraform static checks
on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-static.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-static.yml'
permissions:
  contents: read
jobs:
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate sandbox example without a backend
        working-directory: terraform/examples/sandbox
        run: |
          terraform init -backend=false -input=false
          terraform validate
